[package]
name = "shell"
version = "0.10.0"
edition = "2024"
license = "BSD-2-Clause"
description = "WolOS shell UI: menu bar, dock, notifications, control center, spotlight, lock, login, settings"

# Standalone until the root workspace lists this crate.
[workspace]

[features]
default = ["layer-shell"]
# Needs gtk4-layer-shell >= 1.1 C lib (FreeBSD: x11-toolkits/gtk4-layer-shell). Off: plain windows for dev.
layer-shell = ["dep:gtk4-layer-shell", "dep:gtk4-session-lock"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }

gtk4-layer-shell = { version = "0.8", optional = true }
gtk4-session-lock = { version = "0.4", optional = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"

[profile.release]
lto = "thin"
codegen-units = 4
